{{- if .Values.staticFiles.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ghost-helm.fullname" . }}-static-files
  labels:
    {{- include "ghost-helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: static-files
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    {{- include "ghost-helm.staticFilesSelectorLabels" . | nindent 4 }}
{{- end }}
