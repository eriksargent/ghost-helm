# Ghost Helm Chart Values

# Ghost application configuration
ghost:
  # Ghost version
  version: "6.72.0-alpine"

  # Domain configuration
  domain: "example.com"
  adminDomain: "admin.example.com"
  url: "https://example.com"
  adminUrl: "https://admin.example.com"

  # Storage configuration
  persistence:
    enabled: true
    size: 20Gi
    accessMode: ReadWriteMany
    # storageClassName: ""  # Optional: specify storage class name, defaults to cluster default if not set

# ActivityPub configuration
activitypub:
  # ActivityPub version
  version: "1.2.15"

  # Enable/disable ActivityPub deployment
  enabled: true

  # Configuration
  port: 8080
  localStoragePath: "/opt/activitypub/content/images/activitypub"
  useMq: false
  allowPrivateAddress: true

# Database configuration
database:
  # Database settings
  client: "mysql"
  name: "ghost"
  host: "db"
  user: "ghost"

  # Additional databases to create
  multipleDatabases: "activitypub"

  # Persistence
  persistence:
    enabled: true
    size: 8Gi
    accessMode: ReadWriteOnce

# Secrets configuration
secrets:
  # Database passwords
  database:
    password: "ghostpassword"
    rootPassword: "reallysecurerootpassword"

  # Mail configuration
  mail:
    host: "smtp.example.com"
    port: "465"
    secure: "true"
    transport: "SMTP"
    auth:
      user: "postmaster@example.com"
      password: "1234567890"

# Non-sensitive environment configuration
env:
  nodeEnv: "production"

# Service configuration
service:
  ghost:
    type: ClusterIP
    port: 2368
    targetPort: 2368

  database:
    type: ClusterIP
    port: 3306
    targetPort: 3306

  activitypub:
    type: ClusterIP
    port: 8080
    targetPort: 8080

# Ingress configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

# Files served directly by nginx rather than Ghost. Each file is exposed only at
# its exact `path` on the public Ghost domain. `name` must be a simple filename
# because it is used as a ConfigMap key.
staticFiles:
  enabled: false
  image: "nginx:1.27-alpine"
  files: []
  # - name: "apple-app-site-association"
  #   path: "/.well-known/apple-app-site-association"
  #   contentType: "application/json"
  #   content: |
  #     {"applinks":{"apps":[]}}

# Exact-path redirects served by dedicated NGINX Ingress resources. Keep this
# empty by default; site-specific values files supply the redirect catalog.
redirects: []

# Resource configuration
resources:
  ghost:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  database:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  activitypub:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  staticFiles:
    requests:
      memory: "16Mi"
      cpu: "10m"
    limits:
      memory: "64Mi"
      cpu: "100m"
